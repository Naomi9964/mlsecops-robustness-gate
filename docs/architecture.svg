<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" viewBox="0 0 1360 660" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1360" height="660" fill="#f6f8fb"/>
  <text x="680" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#0f172a">MLSecOps Robustness Gate — System Architecture</text>

  <!-- ============ INPUTS ============ -->
  <text x="60" y="84" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">INPUTS</text>

  <g>
    <rect x="60" y="96" width="200" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="160" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">Model Registry</text>
    <text x="160" y="144" font-size="12.5" text-anchor="middle" fill="#047857">model.pt — any nn.Module</text>
    <text x="160" y="162" font-size="12.5" text-anchor="middle" fill="#047857">versioned per commit</text>
  </g>
  <g>
    <rect x="290" y="96" width="200" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="390" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">Policy File</text>
    <text x="390" y="144" font-size="12.5" text-anchor="middle" fill="#047857">policies/default.yaml</text>
    <text x="390" y="162" font-size="12.5" text-anchor="middle" fill="#047857">thresholds per (attack, ε)</text>
  </g>
  <g>
    <rect x="520" y="96" width="200" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="620" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">Test Data</text>
    <text x="620" y="144" font-size="12.5" text-anchor="middle" fill="#047857">DataLoader (held-out)</text>
    <text x="620" y="162" font-size="12.5" text-anchor="middle" fill="#047857">synthetic demo, offline</text>
  </g>
  <g>
    <rect x="980" y="96" width="200" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1080" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#9a3412">Trigger</text>
    <text x="1080" y="144" font-size="12.5" text-anchor="middle" fill="#c2410c">push / PR / nightly cron</text>
    <text x="1080" y="162" font-size="12.5" text-anchor="middle" fill="#c2410c">or manual run</text>
  </g>

  <!-- ============ PIPELINE ============ -->
  <text x="60" y="214" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">WORKFLOW — robogate.gate.Gate.run()</text>

  <g id="stages">
    <rect x="60" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="150" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">1 · Load</text>
    <text x="150" y="278" font-size="12.5" text-anchor="middle" fill="#334155">model + policy</text>
    <text x="150" y="297" font-size="12.5" text-anchor="middle" fill="#334155">test loader</text>

    <rect x="270" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="360" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">2 · Baseline</text>
    <text x="360" y="278" font-size="12.5" text-anchor="middle" fill="#334155">clean accuracy</text>
    <text x="360" y="297" font-size="12.5" text-anchor="middle" fill="#334155">metrics.accuracy()</text>

    <rect x="480" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="570" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">3 · Attack Suite</text>
    <text x="570" y="278" font-size="12.5" text-anchor="middle" fill="#334155">FGSM · PGD · BIM · NES</text>
    <text x="570" y="297" font-size="12.5" text-anchor="middle" fill="#334155">Noise baseline · ε ∈ {0.05, 0.1, 0.2}</text>

    <rect x="690" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="780" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">4 · Metrics</text>
    <text x="780" y="278" font-size="12.5" text-anchor="middle" fill="#334155">robust accuracy</text>
    <text x="780" y="297" font-size="12.5" text-anchor="middle" fill="#334155">attack success rate</text>

    <rect x="900" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="990" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">5 · Policy Check</text>
    <text x="990" y="278" font-size="12.5" text-anchor="middle" fill="#334155">policy.check()</text>
    <text x="990" y="297" font-size="12.5" text-anchor="middle" fill="#334155">thresholds → violations</text>

    <rect x="1110" y="226" width="180" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="1200" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">6 · Verdict</text>
    <text x="1200" y="278" font-size="12.5" text-anchor="middle" fill="#334155">PASS / FAIL</text>
    <text x="1200" y="297" font-size="12.5" text-anchor="middle" fill="#334155">report.md + .json</text>
  </g>

  <!-- stage arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="240" y1="278" x2="266" y2="278" marker-end="url(#arrow)"/>
    <line x1="450" y1="278" x2="476" y2="278" marker-end="url(#arrow)"/>
    <line x1="660" y1="278" x2="686" y2="278" marker-end="url(#arrow)"/>
    <line x1="870" y1="278" x2="896" y2="278" marker-end="url(#arrow)"/>
    <line x1="1080" y1="278" x2="1106" y2="278" marker-end="url(#arrow)"/>
  </g>

  <!-- input feed arrows -->
  <g stroke="#059669" stroke-width="2" fill="none">
    <line x1="160" y1="172" x2="160" y2="222" marker-end="url(#arrow)"/>
    <polyline points="390,172 390,200 990,200 990,222" marker-end="url(#arrow)"/>
    <line x1="620" y1="172" x2="620" y2="196"/>
    <line x1="360" y1="196" x2="780" y2="196"/>
    <line x1="360" y1="196" x2="360" y2="222" marker-end="url(#arrow)"/>
    <line x1="570" y1="196" x2="570" y2="222" marker-end="url(#arrow)"/>
    <line x1="780" y1="196" x2="780" y2="222" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#ea580c" stroke-width="2" fill="none">
    <polyline points="1080,172 1080,200 150,200 150,222" marker-end="url(#arrow)"/>
  </g>
  <text x="700" y="192" font-size="11.5" text-anchor="middle" fill="#047857">test data feeds stages 2–4</text>
  <text x="600" y="216" font-size="11.5" text-anchor="middle" fill="#c2410c">trigger starts gate.run()</text>

  <!-- attack detail -->
  <g>
    <rect x="400" y="360" width="250" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="525" y="386" font-size="14" font-weight="700" text-anchor="middle" fill="#1e40af">White-box</text>
    <text x="525" y="408" font-size="12" text-anchor="middle" fill="#3730a3">FGSM · BIM · PGD (L_inf)</text>
    <rect x="670" y="360" width="250" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="795" y="386" font-size="14" font-weight="700" text-anchor="middle" fill="#1e40af">Black-box</text>
    <text x="795" y="408" font-size="12" text-anchor="middle" fill="#3730a3">NES query-only · Noise baseline</text>
    <line x1="530" y1="330" x2="510" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="610" y1="330" x2="720" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="452" font-size="12" text-anchor="middle" fill="#64748b">white-box &amp; black-box · L∞ ball · pixels clipped to [0, 1]</text>
  </g>

  <!-- outputs -->
  <text x="1050" y="392" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">OUTPUTS</text>
  <g>
    <rect x="1050" y="404" width="250" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1175" y="430" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">report.md / report.json</text>
    <text x="1175" y="452" font-size="12" text-anchor="middle" fill="#6d28d9">human table + CI artifact</text>
    <line x1="1200" y1="330" x2="1200" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="1050" y="488" width="250" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1175" y="514" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">CI gate · exit code</text>
    <text x="1175" y="538" font-size="12.5" text-anchor="middle" fill="#15803d">exit 0 → PASS → merge allowed</text>
    <text x="1175" y="558" font-size="12.5" text-anchor="middle" fill="#b91c1c">exit 1 → FAIL → merge blocked</text>
    <line x1="1200" y1="468" x2="1200" y2="484" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <text x="1175" y="610" font-size="12" text-anchor="middle" fill="#64748b">GitHub Actions: .github/workflows/robogate.yml · artifacts uploaded on every run</text>

  <!-- extension note -->
  <g>
    <rect x="60" y="488" width="840" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="80" y="516" font-size="14" font-weight="700" fill="#334155">Bring your own model</text>
    <text x="80" y="540" font-size="12.5" fill="#64748b">Subclass nothing — any torch.nn.Module works: Gate(model, your_loader, ATTACKS, epsilons, load_policy(...))</text>
    <text x="80" y="562" font-size="12.5" fill="#64748b">Roadmap: black-box attacks · randomized smoothing · MLflow registry · trend dashboard</text>
  </g>
</svg>
